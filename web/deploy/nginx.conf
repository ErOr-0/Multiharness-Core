server {
    listen 80;
    listen [::]:80;
    server_name multiharness.mdfahimhossen.space;

    access_log /var/log/nginx/multiharness.access.log;
    error_log /var/log/nginx/multiharness.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/multiharness/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://multiharness.mdfahimhossen.space$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name multiharness.mdfahimhossen.space;

    ssl_certificate /etc/letsencrypt/live/multiharness.mdfahimhossen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multiharness.mdfahimhossen.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/multiharness/current;
    index index.html;

    access_log /var/log/nginx/multiharness.access.log;
    error_log /var/log/nginx/multiharness.error.log;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ /\. {
        deny all;
    }
}
