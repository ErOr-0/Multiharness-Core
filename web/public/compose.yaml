# Multiharness: original host files at /workspace; logins/settings in magent-state.
# JSON is valid YAML. Keep seccomp.json beside this file; see NOTICE.md.
# Set the bind source to your existing absolute host folder. Do not use compose down -v.
{
  "name": "multiharness",
  "services": {
    "magent": {
      "image": "er0r2/multiharness-core:preview",
      "init": true,
      "stdin_open": true,
      "tty": true,
      "user": "${MAGENT_UID:-1000}:${MAGENT_GID:-1000}",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges=true",
        "seccomp=./seccomp.json"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": "__MAGENT_PROJECT_DIR__",
          "target": "/workspace",
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "volume",
          "source": "state",
          "target": "/state"
        }
      ]
    }
  },
  "volumes": {
    "state": {
      "name": "${MAGENT_STATE_VOLUME:-magent-state}"
    }
  }
}
