name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub Release with one binary per
# system and a checksums file. install.sh and install.ps1 download from the
# latest release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "release/harness-bridge_${os}_${arch}${ext}" ./cmd/harness-bridge
          done
          cd release && sha256sum harness-bridge_* > checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" release/* --title "$VERSION" --generate-notes
