name: multiharness
services:
  multiharness:
    image: er0r2/multiharness:latest
    container_name: multiharness
    init: true
    stdin_open: true
    tty: true
    restart: "no"
    user: "${MULTIHARNESS_UID:-1000}:${MULTIHARNESS_GID:-1000}"
    environment:
      MAGENT_HOST_WORKSPACE: ${MULTIHARNESS_WORKSPACE:?Set MULTIHARNESS_WORKSPACE to your absolute project folder}
      # Default endpoint for a self-hosted Laya decision server on this host
      # (/set decision-provider laya). Override with LAYA_ENDPOINT when the
      # server listens elsewhere; LAYA_API_KEY is only needed if it requires one.
      LAYA_ENDPOINT: ${LAYA_ENDPOINT:-http://host.docker.internal:8765/v1/systemone}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
      - seccomp=./docker/seccomp.json
    volumes:
      - type: bind
        source: ${MULTIHARNESS_WORKSPACE:?Set MULTIHARNESS_WORKSPACE to your absolute project folder}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: state
        target: /state
volumes:
  state:
    name: magent-state
