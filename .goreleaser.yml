version: 2
project_name: magent
dist: dist/release

builds:
  - id: magent-host
    main: ./cmd/magent-launcher
    binary: magent
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: magent
    main: ./cmd/multiharness
    binary: magent
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - id: host-launchers
    ids: [magent-host]
    formats: [zip]
    name_template: 'magent-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - docs/host-launcher.md
      - docker/NOTICE.md
      - docker/LICENSE.moby
      - docker/apparmor.profile
      - scripts/magent-apparmor.sh
  - id: magent
    ids: [magent]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - docs/*.md
      - examples/multiharness.json
      - examples/codex-team.json
  - id: docker-launchers
    meta: true
    formats: [zip]
    name_template: 'magent_docker_{{ .Version }}'
    files:
      - scripts/magent-docker.sh
      - scripts/magent-docker.ps1
      - scripts/magent-apparmor.sh
      - docker/seccomp.json
      - docker/apparmor.profile
      - docker/NOTICE.md
      - docker/LICENSE.moby
      - docs/docker.md
      - docs/workspaces.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: true
  prerelease: auto
  header: |
    Download the archive for your operating system and processor, then follow
    [the installation guide](https://github.com/ErOr-0/Multiharness-Core/blob/{{ .Tag }}/docs/releases.md).

    Recommended: choose a magent-host ZIP for Windows, macOS or Linux, then
    follow docs/host-launcher.md. The native launcher selects your PC folder
    and runs the agent tools in Docker. Use magent --config for Folder, Models
    and Accounts. Docker Desktop or Engine must be running.

    The separate magent tar.gz packages run the agent tools on macOS or Linux
    directly and require the authenticated agent CLIs you select. Git is optional.
    Codex can handle every role with independently selected models.
    Go is not required to run magent, but your project's checks may require it.
    These archives are not Apple Developer ID signed or notarized.

    Maintainer: review the release-readiness checklist and add the actual
    provider/platform smoke-test results before publishing this draft.

changelog:
  sort: asc
