version: 2
project_name: magent
dist: dist/release

builds:
  - id: magent
    main: ./cmd/multiharness
    binary: magent
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - id: magent
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - docs/*.md
      - examples/multiharness.json
      - examples/codex-team.json
  - id: docker-launchers
    meta: true
    formats: [zip]
    name_template: 'magent_docker_{{ .Version }}'
    files:
      - scripts/magent-docker.sh
      - scripts/magent-docker.ps1
      - scripts/magent-apparmor.sh
      - docker/seccomp.json
      - docker/apparmor.profile
      - docker/NOTICE.md
      - docker/LICENSE.moby
      - docs/docker.md
      - docs/workspaces.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: true
  prerelease: auto
  header: |
    Download the archive for your operating system and processor, then follow
    [the installation guide](https://github.com/ErOr-0/Multiharness-Core/blob/{{ .Tag }}/docs/releases.md).

    macOS and Linux packages are provided for amd64 and arm64. Windows users
    can use the Docker launcher ZIP with Docker Desktop, or run the Linux binary
    inside WSL with Linux-installed dependencies. Native Windows execution is
    not supported by this release. See docs/docker.md for the Docker preview's
    authentication, project-tooling and platform verification boundaries.

    Native binaries need Git and the authenticated agent CLIs you select.
    Codex can handle every role with independently selected models.
    Go is not required to run magent, but your project's checks may require it.
    These archives are not Apple Developer ID signed or notarized.

    Maintainer: review the release-readiness checklist and add the actual
    provider/platform smoke-test results before publishing this draft.

changelog:
  sort: asc
